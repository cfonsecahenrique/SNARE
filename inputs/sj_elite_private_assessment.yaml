# All 29 elite EBSNs under private assessment — observability sweep.
#
# Runs every elite EBSN (ACR >= 85% at gamma=1, q=1) across all four leading
# base norms (SJ, IS, SH, SS) at three observability levels (q = 0.4, 0.6,
# 0.8).  q=1 results are already available from the canonical sweeps.
# Each variant carries its own 4bit_orig base norm from the CSV.
#
# gamma=[0.5, 1] mirrors the slopegraph design: the gamma=0.5 vs gamma=1
# comparison is now repeated at reduced observability to ask whether the
# cooperation gains survive private assessment.
#
# consensus_thresh=0 disables the consensus fallback entirely; gamma alone
# controls whether the EBSN or the base norm is applied.
#
# Parameter combinations: 29 norms × 3 q-values × 2 gamma-values × 20 runs
#   = 3480 total runs.
#
# Usage:
#   python SNARE.py inputs/sj_elite_private_assessment.yaml

running:
  runs: 20
  cores: all
  plotting: false
  output_file: "elite_private_assessment.csv"

simulation:
  norm: all_elite_private   # 29 elite EBSNs from data/new_norms.csv
  ebsn:                     # overridden by norm mode
  sn: [1, 0, 0, 1]         # placeholder; actual base norm comes from 4bit_orig

  # Private-assessment regime: observability sweep
  z: 40
  observability: [0.4, 0.6, 0.8]
  consensus_thresh: 0     # fallback fires when consensus < ~80% agreement
  non_consensus_strategy: emotion   # use EBSN as fallback when reputation is noisy

  # Errors (same as canonical sweeps)
  chi: 0.01
  eps: 0.01
  alpha: 0
  xi: 0

  # Payoffs
  benefit: 5
  cost: 1

  # Evolutionary dynamics
  beta: 1
  mu: 1
  generations: 1600
  convergence period: 0.25

  # Gamma sweep: 0 = pure base-norm baseline, 1 = full EBSN use
  gamma_min: 0
  gamma_max: 1
  gamma_delta: 0
  gamma_gaussian_n: [0.5, 1]
