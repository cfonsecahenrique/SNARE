# Fine-grained population-size robustness sweep
# Z values: 40 to 150 in steps of 10 (12 values)
# Generations: 40 * Z (multiplier convention — SNARE computes G = 40 * z)
#
# Baseline anchor: q=0.8, kappa_c=0.8, xi=0.01, alpha=0, mu=2/Z, beta=1, b/c=5
# EBSN: GGBBBBGG (SJ + cooperative emotional profile)
#
# Usage (submit all 12*25=300 jobs via SLURM):
#   python submit_slurm.py inputs/sweep_z_fine.yaml

running:
  runs: 25
  cores: all
  plotting: false
  output_file: "sweep_z_fine.csv"

simulation:
  ebsn: [1, 1, 0, 0, 0, 0, 1, 1]  # GGBBBBGG = SJ
  sn: [1, 0, 0, 1]                  # SJ base norm
  norm:

  z: [140, 150]
  mu: 2                              # mu = 2/Z (divided by Z internally)
  chi: 0.01
  eps: 0.01
  alpha: 0
  xi: 0.01
  benefit: 5
  cost: 1
  beta: 1
  observability: 0.8
  consensus_thresh: 0.8
  non_consensus_strategy: emotion
  gamma_min: 0
  gamma_max: 1
  gamma_delta: 0
  gamma_gaussian_n: 1
  generations: 40                    # multiplier: G = 40 * Z
  convergence period: 0.25
