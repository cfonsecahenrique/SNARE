running:
  runs: 5
  cores: all
  plotting: true
  output_file: "test_action_fallback.csv"
simulation:
  random_image_matrix: false
  norm:
  ebsn: [1, 1, 0, 0, 0, 0, 1, 1]  # GGBBBBGG=SJ broadcast across EPs
  sn: [1, 0, 0, 1]                # Stern Judging base norm
  z: 40
  mu: 1 # mu/Z
  chi: 0.01
  eps: 0.01
  alpha: 0
  xi: 0.01
  benefit: 5
  cost: 1
  beta: 1
  observability: 0.6
  consensus_thresh: 0.6
  non_consensus_strategy: action   # action-valence fallback (Fig. time_series_action_fallback)
  gamma_min: 0
  gamma_max: 1
  gamma_delta: 0 # use 0 for homogeneous population
  gamma_gaussian_n: 1
  generations: 40  # multiplier: actual total generations = generations * z = 1600
  convergence period: 0
